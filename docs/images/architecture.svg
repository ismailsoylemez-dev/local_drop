<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">Mimari</text>
  <text x="40" y="74" font-size="14" fill="#475569">Tek uygulama içinde: Flutter arayüzü + shelf HTTP sunucusu. Dışarıya hiçbir istek atılmaz.</text>

  <!-- PC zone -->
  <rect x="40" y="110" width="250" height="450" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="165" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Bilgisayar</text>
  <rect x="65" y="250" width="200" height="120" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="165" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Tarayıcı</text>
  <text x="165" y="312" text-anchor="middle" font-size="12" fill="#475569">Chrome / Edge / Firefox</text>
  <text x="165" y="332" text-anchor="middle" font-size="12" fill="#475569">web_ui.dart (tek HTML,</text>
  <text x="165" y="350" text-anchor="middle" font-size="12" fill="#475569">CDN yok)</text>

  <!-- LAN arrow -->
  <line x1="268" y1="300" x2="372" y2="300" stroke="#0f766e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="320" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">HTTP</text>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#475569">Wi-Fi / LAN</text>

  <!-- Phone zone -->
  <rect x="380" y="110" width="780" height="450" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="770" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Android telefon — Local Drop uygulaması</text>

  <!-- Server pipeline column -->
  <g font-size="13">
    <rect x="410" y="165" width="300" height="50" rx="10" fill="#ffffff" stroke="#0f766e"/>
    <text x="560" y="187" text-anchor="middle" font-weight="700" fill="#0f172a">ServerService (shelf_io)</text>
    <text x="560" y="205" text-anchor="middle" font-size="11.5" fill="#475569">0.0.0.0 · port 8080→8090 · token + PIN üretir</text>

    <rect x="410" y="235" width="300" height="42" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="560" y="261" text-anchor="middle" fill="#0f172a">errorMiddleware → 500 JSON</text>

    <rect x="410" y="295" width="300" height="50" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="560" y="317" text-anchor="middle" fill="#0f172a">authMiddleware</text>
    <text x="560" y="335" text-anchor="middle" font-size="11.5" fill="#475569">?t= / cookie · sabit zamanlı karşılaştırma</text>

    <rect x="410" y="363" width="300" height="42" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="560" y="389" text-anchor="middle" fill="#0f172a">shelf_router</text>

    <!-- handlers -->
    <rect x="410" y="423" width="94" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="457" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">login</text>
    <text x="457" y="459" text-anchor="middle" font-size="10" fill="#475569">PIN → cookie</text>
    <rect x="513" y="423" width="94" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="560" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">files</text>
    <text x="560" y="459" text-anchor="middle" font-size="10" fill="#475569">liste/indir/sil</text>
    <rect x="616" y="423" width="94" height="46" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="663" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">upload</text>
    <text x="663" y="459" text-anchor="middle" font-size="10" fill="#475569">stream → .part</text>

    <rect x="410" y="490" width="300" height="50" rx="10" fill="#ffffff" stroke="#0f766e"/>
    <text x="560" y="512" text-anchor="middle" font-weight="700" fill="#0f172a">StorageService</text>
    <text x="560" y="530" text-anchor="middle" font-size="11.5" fill="#475569">safeName · resolve() kök dışına çıkamaz</text>
  </g>
  <g stroke="#0f766e" stroke-width="2" marker-end="url(#a)">
    <line x1="560" y1="215" x2="560" y2="233"/>
    <line x1="560" y1="277" x2="560" y2="293"/>
    <line x1="560" y1="345" x2="560" y2="361"/>
    <line x1="560" y1="405" x2="560" y2="421"/>
    <line x1="560" y1="469" x2="560" y2="488"/>
  </g>
  <!-- LAN arrow lands on server -->
  <path d="M372 300 H390 V190 H408" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>

  <!-- App side column -->
  <g font-size="13">
    <rect x="800" y="165" width="330" height="60" rx="10" fill="#ffffff" stroke="#0f766e"/>
    <text x="965" y="190" text-anchor="middle" font-weight="700" fill="#0f172a">UI (Material 3)</text>
    <text x="965" y="210" text-anchor="middle" font-size="11.5" fill="#475569">home_screen · durum, URL, PIN, Başlat/Durdur</text>

    <rect x="800" y="270" width="330" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="965" y="296" text-anchor="middle" font-weight="700" fill="#0f172a">ServerController</text>
    <text x="965" y="314" text-anchor="middle" font-size="11.5" fill="#475569">ChangeNotifier (Provider) — UI'nin tek</text>
    <text x="965" y="330" text-anchor="middle" font-size="11.5" fill="#475569">durum kaynağı: stopped/starting/running/error</text>

    <rect x="800" y="385" width="330" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="965" y="408" text-anchor="middle" font-weight="700" fill="#0f172a">NetworkService</text>
    <text x="965" y="427" text-anchor="middle" font-size="11.5" fill="#475569">Wi-Fi/hotspot IPv4 · 3 sn yoklama · mobil veri elenir</text>

    <rect x="800" y="480" width="330" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="965" y="503" text-anchor="middle" font-weight="700" fill="#0f172a">Disk</text>
    <text x="965" y="522" text-anchor="middle" font-size="11.5" fill="#475569">uygulama klasörü/received</text>
  </g>
  <g stroke="#0f766e" stroke-width="2" fill="none">
    <line x1="965" y1="268" x2="965" y2="227" marker-end="url(#a)"/>
    <text x="975" y="252" font-size="11" fill="#0f766e" stroke="none">notifyListeners</text>
    <line x1="965" y1="383" x2="965" y2="342" marker-end="url(#a)"/>
    <text x="975" y="367" font-size="11" fill="#0f766e" stroke="none">Stream&lt;NetworkResult&gt;</text>
    <!-- controller -> server start/stop -->
    <path d="M798 290 H740 V190 H712" marker-end="url(#a)"/>
    <text x="746" y="240" font-size="11" fill="#0f766e" stroke="none">start/stop</text>
    <!-- server events -> controller -->
    <path d="M712 205 H728 V320 H798" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <text x="732" y="345" font-size="11" fill="#0f766e" stroke="none">ServerEvent</text>
    <!-- storage -> disk -->
    <line x1="712" y1="515" x2="798" y2="508" marker-end="url(#a)"/>
  </g>
</svg>
