      <g fill="#0f172a">
        <rect x="8" y="8" width="20" height="20"/><rect x="12" y="12" width="12" height="12" fill="#fff"/><rect x="15" y="15" width="6" height="6"/>
        <rect x="52" y="8" width="20" height="20"/><rect x="56" y="12" width="12" height="12" fill="#fff"/><rect x="59" y="15" width="6" height="6"/>
        <rect x="8" y="52" width="20" height="20"/><rect x="12" y="56" width="12" height="12" fill="#fff"/><rect x="15" y="59" width="6" height="6"/>
        <rect x="34" y="10" width="6" height="6"/><rect x="42" y="18" width="6" height="6"/><rect x="34" y="34" width="6" height="6"/>
        <rect x="46" y="38" width="6" height="6"/><rect x="58" y="36" width="6" height="6"/><rect x="38" y="48" width="6" height="6"/>
        <rect x="54" y="52" width="6" height="6"/><rect x="64" y="60" width="6" height="6"/><rect x="44" y="62" width="6" height="6"/>
        <rect x="34" y="58" width="4" height="4"/><rect x="60" y="46" width="4" height="4"/><rect x="10" y="38" width="6" height="6"/><rect x="20" y="42" width="4" height="4"/>
      </g>
    </g>
    <text x="75" y="152" text-anchor="middle" font-size="9.5" fill="#134e4a" font-family="Consolas, monospace">192.168.1.50:8080</text>
    <text x="75" y="168" text-anchor="middle" font-size="10" fill="#334155">PIN  4 8 1 2 0 7</text>
    <rect x="30" y="188" width="90" height="28" rx="14" fill="#0f766e"/>
    <text x="75" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Durdur</text>
  </g>
  <text x="245" y="415" text-anchor="middle" font-size="13" fill="#ccfbf1" opacity="0">.</text>

  <!-- Wi-Fi link -->
  <g transform="translate(600,270)">
    <path d="M-220 0 C -120 -70, 120 -70, 220 0" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round"/>
    <path d="M-220 30 C -120 90, 120 90, 220 30" fill="none" stroke="#99f6e4" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round" opacity="0.7"/>
    <polygon points="214,-8 230,2 212,10" fill="#5eead4"/>
    <polygon points="-212,22 -230,30 -214,40" fill="#99f6e4" opacity="0.8"/>
    <!-- wifi icon -->
    <g transform="translate(0,-10)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <path d="M-26 -8 A 37 37 0 0 1 26 -8"/>
      <path d="M-16 2 A 23 23 0 0 1 16 2"/>
      <circle cx="0" cy="12" r="3.5" fill="#ffffff" stroke="none"/>
    </g>
    <text x="0" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Yerel ağ (LAN)</text>
    <!-- file chips -->
    <g transform="translate(-95,-62)">
      <rect width="62" height="24" rx="12" fill="#ffffff"/>
      <text x="31" y="16.5" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600">foto.jpg</text>
    </g>
    <g transform="translate(40,62)">
      <rect width="62" height="24" rx="12" fill="#ffffff"/>
      <text x="31" y="16.5" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="600">rapor.pdf</text>
    </g>
  </g>

  <!-- Laptop -->
  <g transform="translate(830,170)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#0b1f1d" stroke="#5eead4" stroke-width="2"/>
    <rect x="10" y="10" width="220" height="140" rx="4" fill="#ffffff"/>
    <rect x="10" y="10" width="220" height="20" rx="4" fill="#e2e8f0"/>
    <circle cx="22" cy="20" r="3.5" fill="#f87171"/><circle cx="34" cy="20" r="3.5" fill="#fbbf24"/><circle cx="46" cy="20" r="3.5" fill="#34d399"/>
    <rect x="58" y="14" width="160" height="12" rx="6" fill="#ffffff"/>
    <text x="64" y="23.5" font-size="8.5" fill="#475569" font-family="Consolas, monospace">http://192.168.1.50:8080</text>
    <rect x="26" y="40" width="188" height="52" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-dasharray="5 4"/>
    <path d="M120 52 v18 M111 61 l9 -9 l9 9" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="84" text-anchor="middle" font-size="9" fill="#0f766e">Dosyaları buraya sürükle</text>
    <rect x="26" y="102" width="188" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="26" y="102" width="128" height="9" rx="4.5" fill="#14b8a6"/>
    <rect x="26" y="120" width="120" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="26" y="133" width="90" height="7" rx="3.5" fill="#cbd5e1"/>
    <path d="M-18 160 h276 l-14 18 h-248 z" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
