<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1100" cy="40" r="160"/>
    <circle cx="80" cy="400" r="120"/>
  </g>

  <!-- Title -->
  <text x="600" y="78" text-anchor="middle" font-size="52" font-weight="700" fill="#ffffff">Local Drop</text>
  <text x="600" y="116" text-anchor="middle" font-size="20" fill="#99f6e4">Telefon ↔ Bilgisayar · Aynı Wi-Fi · Kablo yok · İnternet yok · Hesap yok</text>

  <!-- Phone -->
  <g transform="translate(170,150)">
    <rect x="0" y="0" width="150" height="250" rx="22" fill="#0b1f1d" stroke="#5eead4" stroke-width="2"/>
    <rect x="10" y="16" width="130" height="218" rx="12" fill="url(#screen)"/>
    <rect x="58" y="6" width="34" height="5" rx="2.5" fill="#334155"/>
