  <text x="68" y="47" font-size="18" font-weight="700" fill="#FFFFFF">Başlat</text>
  <text x="20" y="90" font-size="14" fill="#CCFBF1">Telefonda Başlat'a basılır;</text>
  <text x="20" y="112" font-size="14" fill="#CCFBF1">Wi-Fi / hotspot IPv4 bulunur,</text>
  <text x="20" y="134" font-size="14" fill="#CCFBF1">8080'de shelf sunucusu ve</text>
  <text x="20" y="156" font-size="14" fill="#CCFBF1">kalıcı bildirim açılır.</text>
