<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Nasıl çalışır? — 4 adım</text>

  <!-- connectors -->
  <g stroke="#14b8a6" stroke-width="3" stroke-dasharray="8 7" fill="none">
    <path d="M300 190 H330"/><path d="M590 190 H620"/><path d="M880 190 H910"/>
  </g>
  <g fill="#14b8a6">
    <polygon points="330,183 342,190 330,197"/><polygon points="620,183 632,190 620,197"/><polygon points="910,183 922,190 910,197"/>
  </g>

  <!-- Card template: x offsets 40, 340, 630, 920 ; width 250 -->
  <!-- 1 -->
  <g transform="translate(40,80)">
    <rect width="260" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="36" cy="36" r="18" fill="#0f766e"/><text x="36" y="42.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <g transform="translate(130,82)">
      <rect x="-22" y="-34" width="44" height="72" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
      <circle cx="0" cy="2" r="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
      <path d="M0 -5 v8 M-5 -2 a7 7 0 1 0 10 0" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="130" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Başlat</text>
    <text x="130" y="176" text-anchor="middle" font-size="13" fill="#475569">Telefonda “Başlat”a bas.</text>
    <text x="130" y="195" text-anchor="middle" font-size="13" fill="#475569">Uygulama Wi-Fi IP'sini bulur,</text>
    <text x="130" y="214" text-anchor="middle" font-size="13" fill="#475569">8080'de sunucu açar.</text>
  </g>
  <!-- 2 -->
  <g transform="translate(330,80)">
    <rect width="260" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="36" cy="36" r="18" fill="#0f766e"/><text x="36" y="42.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <g transform="translate(130,82)" fill="#0f172a">
      <rect x="-32" y="-32" width="64" height="64" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <rect x="-26" y="-26" width="16" height="16"/><rect x="-22" y="-22" width="8" height="8" fill="#fff"/>
      <rect x="10" y="-26" width="16" height="16"/><rect x="14" y="-22" width="8" height="8" fill="#fff"/>
      <rect x="-26" y="10" width="16" height="16"/><rect x="-22" y="14" width="8" height="8" fill="#fff"/>
      <rect x="-4" y="-24" width="5" height="5"/><rect x="2" y="-12" width="5" height="5"/><rect x="-6" y="-2" width="5" height="5"/>
      <rect x="8" y="2" width="5" height="5"/><rect x="18" y="8" width="5" height="5"/><rect x="4" y="16" width="5" height="5"/><rect x="14" y="20" width="5" height="5"/>
    </g>
    <text x="130" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">QR / PIN</text>
    <text x="130" y="176" text-anchor="middle" font-size="13" fill="#475569">Ekranda adres + tek seferlik</text>
    <text x="130" y="195" text-anchor="middle" font-size="13" fill="#475569">token içeren QR ve 6 haneli</text>
    <text x="130" y="214" text-anchor="middle" font-size="13" fill="#475569">PIN görünür.</text>
  </g>
  <!-- 3 -->
  <g transform="translate(620,80)">
    <rect width="260" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="36" cy="36" r="18" fill="#0f766e"/><text x="36" y="42.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <g transform="translate(130,82)">
      <rect x="-46" y="-32" width="92" height="60" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <rect x="-46" y="-32" width="92" height="13" rx="6" fill="#ccfbf1"/>
      <rect x="-38" y="-8" width="76" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="-38" y="6" width="50" height="8" rx="4" fill="#e2e8f0"/>
      <path d="M-58 36 h116" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="130" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Tarayıcıdan bağlan</text>
    <text x="130" y="176" text-anchor="middle" font-size="13" fill="#475569">Bilgisayarda adresi aç.</text>
    <text x="130" y="195" text-anchor="middle" font-size="13" fill="#475569">Token cookie'ye yazılır;</text>
    <text x="130" y="214" text-anchor="middle" font-size="13" fill="#475569">kurulum gerekmez.</text>
  </g>
  <!-- 4 -->
  <g transform="translate(910,80)">
    <rect width="250" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="36" cy="36" r="18" fill="#0f766e"/><text x="36" y="42.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
    <g transform="translate(125,82)" stroke="#0f766e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 -14 h38 M6 -24 l12 10 l-12 10"/>
      <path d="M22 14 h-38 M-6 4 l-12 10 l12 10"/>
    </g>
    <text x="125" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Aktar</text>
    <text x="125" y="176" text-anchor="middle" font-size="13" fill="#475569">Sürükle-bırak ile yükle,</text>
    <text x="125" y="195" text-anchor="middle" font-size="13" fill="#475569">listeden indir, metin gönder.</text>
    <text x="125" y="214" text-anchor="middle" font-size="13" fill="#475569">İş bitince “Durdur”.</text>
  </g>
</svg>
